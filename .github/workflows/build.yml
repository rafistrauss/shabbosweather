on:
  release:
    types:
      - released
  pull_request:
    branches:
      - master
  push:
    branches:
      - fix-gh-pages

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run lint

  Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm exec oxfmt --check .

  Deploy-Github-Pages:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/fix-gh-pages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v6
        with:
          run_install: true
      - run: pnpm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
